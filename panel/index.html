<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>联络总站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23141414'/%3E%3Crect x='9' y='9' width='5' height='5' fill='%23d5381a'/%3E%3C/svg%3E">
<style>
/* ==========================================================================
   Post Office panel. One file, no build, no network.
   Every colour is one of the role variables below; a theme is a set of values for the same roles,
   so a new theme is one block and no component needs to change. The accent (--red) means exactly one thing:
   a letter is waiting. Errors use --bad, nothing else uses either.
   ========================================================================== */
:root{
  --font:"Instrument","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  /* dialog geometry is shared with the docked letter, so the two always line up */
  --dw:min(1080px,calc(100vw - 64px));--dh:min(720px,calc(100vh - 80px));--lw:360px;--hh:72px;
  color-scheme:light;
}
:root,[data-theme=paper]{
  --paper:#ecebe7;--paper-2:#e2e1dc;--ink:#141414;--ink-2:#46453f;--ink-3:#686660;
  --wire:#9a9891;--rule:rgba(20,20,20,.14);--line:20,20,20;--line-a:.062;
  --red:#d5381a;--on-red:#fff;--bad:#b3261e;
  --key-on:#141414;--on-key:#ecebe7;--on-key-2:rgba(236,235,231,.68);--scrim:rgba(20,20,20,.42)}
[data-theme=night]{color-scheme:dark;
  --paper:#131312;--paper-2:#1d1d1b;--ink:#edece7;--ink-2:#bdbbb4;--ink-3:#8f8d86;
  --wire:#56554f;--rule:rgba(237,236,231,.13);--line:237,236,231;--line-a:.06;
  --red:#f0502e;--on-red:#131312;--bad:#ff8a7a;
  --key-on:#edece7;--on-key:#131312;--on-key-2:rgba(19,19,18,.66);--scrim:rgba(0,0,0,.6)}
[data-theme=mist]{
  --paper:#dfe4e8;--paper-2:#d2d9df;--ink:#0e1a26;--ink-2:#39485a;--ink-3:#566577;
  --wire:#8c98a5;--rule:rgba(14,26,38,.14);--line:14,26,38;--line-a:.066;
  --red:#2445d4;--on-red:#fff;--bad:#b3261e;
  --key-on:#0e1a26;--on-key:#dfe4e8;--on-key-2:rgba(223,228,232,.68);--scrim:rgba(14,26,38,.42)}
[data-theme=blueprint]{color-scheme:dark;
  --paper:#1b3d9a;--paper-2:#21479f;--ink:#f3f5fc;--ink-2:#cbd5f2;--ink-3:#a3b3e2;
  --wire:#6f88d4;--rule:rgba(243,245,252,.18);--line:243,245,252;--line-a:.085;
  --red:#ffd23f;--on-red:#14213d;--bad:#ffb4a8;
  --key-on:#f3f5fc;--on-key:#1b3d9a;--on-key-2:rgba(27,61,154,.72);--scrim:rgba(6,14,44,.62)}
[data-theme=pine]{color-scheme:dark;
  --paper:#123c30;--paper-2:#184838;--ink:#eef3ec;--ink-2:#c4d4c8;--ink-3:#97ae9f;
  --wire:#4f7b67;--rule:rgba(238,243,236,.15);--line:238,243,236;--line-a:.07;
  --red:#ffad2e;--on-red:#12261e;--bad:#ffb4a8;
  --key-on:#eef3ec;--on-key:#123c30;--on-key-2:rgba(18,60,48,.72);--scrim:rgba(4,16,12,.6)}
[data-theme=ember]{color-scheme:dark;
  --paper:#2a2622;--paper-2:#35302b;--ink:#f1ebe3;--ink-2:#cfc5b9;--ink-3:#a2978a;
  --wire:#6b6158;--rule:rgba(241,235,227,.14);--line:241,235,227;--line-a:.06;
  --red:#ff6a3d;--on-red:#1c1916;--bad:#ff9a85;
  --key-on:#f1ebe3;--on-key:#2a2622;--on-key-2:rgba(42,38,34,.7);--scrim:rgba(0,0,0,.58)}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper);scrollbar-gutter:stable}
body{color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;min-height:100vh;min-height:100dvh}
html{transition:background .3s}
body.has-layer{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button[disabled]{opacity:.45;cursor:not-allowed}
ul,ol{list-style:none}
::selection{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.key:focus-visible,.cta:focus-visible,.btn.primary:focus-visible{outline-color:var(--red)}
.mono{font-family:var(--mono)}
.dim{color:var(--ink-2)}
[hidden]{display:none!important}

/* the flowing ground: a fixed canvas of faint contour curves behind everything */
#ground{position:fixed;inset:0;width:100vw;height:100vh;z-index:-1;pointer-events:none}

/* ---------- bar ---------- */
.bar{display:flex;align-items:center;gap:20px;min-height:64px;padding:0 32px;padding-top:env(safe-area-inset-top);
  padding-left:max(32px,env(safe-area-inset-left));padding-right:max(32px,env(safe-area-inset-right));
  border-bottom:1px solid var(--ink);position:sticky;top:0;z-index:15;background:var(--paper)}
.brand{display:flex;align-items:baseline;gap:10px;white-space:nowrap}
.brand b{font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand span{color:var(--ink-3);font-size:13px}
.tabs{display:flex;gap:2px;align-self:stretch}
.tabs button{padding:0 14px;font-weight:600;color:var(--ink-3);position:relative;min-height:44px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed=true]{color:var(--ink)}
.tabs button[aria-pressed=true]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;background:var(--ink)}
.bar .sp{flex:1}
.aux{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.act{font-weight:600;color:var(--ink-2);padding:0 10px;min-height:44px}
.act:hover{color:var(--ink)}
.compose-btn{background:var(--ink);color:var(--paper);height:44px;padding:0 18px;font-weight:650}
.compose-btn:hover{background:var(--red);color:var(--on-red)}
.langs{display:inline-flex;margin:0 4px}
.langs button{padding:0 8px;min-height:44px;font-weight:600;font-size:14px;color:var(--ink-3)}
.langs button:hover{color:var(--ink)}
.langs button[aria-pressed=true]{color:var(--ink);box-shadow:inset 0 -2px var(--ink)}
.themes{display:inline-flex;gap:2px;margin:0 6px}
.themes button{width:26px;min-height:44px;position:relative;font-size:0;color:transparent}
.themes button::before{content:"";position:absolute;left:2px;top:50%;width:22px;height:22px;margin-top:-11px;
  border:1px solid var(--ink);background:var(--sw-bg,var(--paper))}
.themes button::after{content:"";position:absolute;right:2px;bottom:calc(50% - 11px);width:9px;height:9px;background:var(--sw-a,var(--ink))}
.themes button[aria-pressed=true]::before{outline:2px solid var(--ink);outline-offset:2px}
.themes [data-theme-choice=system]{--sw-bg:linear-gradient(135deg,#ecebe7 50%,#131312 50%);--sw-a:#d5381a}
.themes [data-theme-choice=paper]{--sw-bg:#ecebe7;--sw-a:#d5381a}
.themes [data-theme-choice=night]{--sw-bg:#131312;--sw-a:#f0502e}
.themes [data-theme-choice=mist]{--sw-bg:#dfe4e8;--sw-a:#2445d4}
.themes [data-theme-choice=blueprint]{--sw-bg:#1b3d9a;--sw-a:#ffd23f}
.themes [data-theme-choice=pine]{--sw-bg:#123c30;--sw-a:#ffad2e}
.themes [data-theme-choice=ember]{--sw-bg:#2a2622;--sw-a:#ff6a3d}
.op-btn{display:flex;align-items:center;gap:10px;height:44px;padding:0 6px 0 12px;border:1px solid var(--ink);font-weight:650;margin-left:6px}
.op-btn:hover{background:var(--paper-2)}
.op-btn .lbl{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.op-btn .lbl b{font-weight:650;font-size:14px}
.op-btn .lbl span{font-size:11.5px;color:var(--ink-3);font-weight:500}
.op-btn .lamp{background:var(--ink)}
.op-btn .lamp.off{background:var(--paper);border:1.5px solid var(--ink-3)}

.mail{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;background:var(--red);color:var(--on-red);
  font-weight:700;font-size:13px;line-height:1;flex:none}
.counter{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border:1px solid var(--ink);font-weight:700;font-size:12px}

/* status: lamp + word, never colour alone */
.lamp{width:11px;height:11px;background:var(--ink);display:block;position:relative;flex:none}
.lamp.human{border-radius:50%}
[data-st=offline]>.lamp,[data-st=offline] .lamp{background:var(--paper);border:1.5px solid var(--ink-3)}
[data-st=idle]>.lamp,[data-st=idle] .lamp{background:var(--ink-3)}
[data-st=working]>.lamp,[data-st=working] .lamp{animation:blink 2.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.chip{font-size:12.5px;font-weight:600;border:1px solid var(--rule);color:var(--ink-2);padding:1px 7px}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.chip.mid{border-color:var(--ink-3);color:var(--ink)}
.st{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;color:var(--ink-2)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink-3);flex:none}
.dot.on{background:var(--ink);border-color:var(--ink)}
.act-badge{font-size:13px;font-weight:600;color:var(--ink-3)}
.act-badge[data-activity=working],.act-badge[data-activity=human]{color:var(--ink)}

main{max-width:1480px;margin:0 auto}
.err{font-weight:650;min-height:0}
.err:not(:empty){background:var(--bad);color:var(--paper);padding:10px 32px}
.toasts{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;
  display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.note{background:var(--ink);color:var(--paper);padding:10px 16px;font-weight:600;font-size:14px;max-width:100%;overflow-wrap:anywhere}
.note:empty{display:none}
.note.fade{animation:fade 7s ease forwards}
@keyframes fade{0%,82%{opacity:1}100%{opacity:0;visibility:hidden}}
.foot{padding:0 32px calc(28px + env(safe-area-inset-bottom));color:var(--ink-3);font-size:12.5px;overflow-wrap:anywhere}
.hintp{color:var(--ink-3);font-size:13px;padding:8px 2px}

/* ---------- organization ---------- */
.org{padding:36px 32px 64px;padding-left:max(32px,env(safe-area-inset-left));padding-right:max(32px,env(safe-area-inset-right))}
.canvas{position:relative}
.wires{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.wires path{fill:none;stroke:var(--wire);stroke-width:1.5}
.wires path.off{stroke-dasharray:3 5}
.wires path.hl{stroke:var(--ink);stroke-width:2.25}
.wires path.route{stroke:var(--red);stroke-width:2;opacity:0;transition:opacity .5s}
.wires path.route.on{opacity:.9}
.orgnote{border:1px solid var(--rule);background:var(--paper-2);padding:14px 16px;color:var(--ink-2);margin-bottom:20px;font-size:13.5px}

.root{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:end;gap:20px 44px;padding-left:30px;margin-bottom:60px}
.root>.lamp{position:absolute;left:0;top:28px}
.root h1{font-weight:700;font-size:68px;line-height:.92;letter-spacing:-.035em;overflow-wrap:anywhere}
.root .who{grid-column:1/3}
.root .who p{margin-top:10px;color:var(--ink-2);font-weight:500}
.root .who p b{color:var(--ink);font-weight:650}
.stats{display:flex;gap:32px;padding-bottom:4px}
.stat b{display:block;font-weight:700;font-size:34px;line-height:1;letter-spacing:-.02em;font-stretch:85%}
.stat b small{font-size:.5em;color:var(--ink-3);font-weight:700}
.stat span{display:block;margin-top:6px;font-size:13px;color:var(--ink-3);font-weight:500}
.cta{display:flex;align-items:center;gap:14px;background:var(--red);color:var(--on-red);padding:12px 20px 12px 14px;min-height:64px;text-align:left}
.cta b{font-weight:700;font-size:40px;line-height:1;font-stretch:85%;letter-spacing:-.02em}
.cta span{font-weight:650;line-height:1.2;font-size:14px}
.cta:hover{background:var(--ink);color:var(--paper)}
.cta.zero{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.cta.zero:hover{background:var(--ink);color:var(--paper)}

.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:56px 40px}
.col{position:relative;min-width:0}
.head{position:relative;padding-left:24px;margin-bottom:14px}
.head .mk{position:absolute;left:0;top:14px;width:11px;height:11px;background:var(--ink)}
.head .num{display:block;font-weight:700;font-size:76px;line-height:.8;letter-spacing:-.04em;font-stretch:75%}
.head h2{font-weight:700;font-size:22px;letter-spacing:-.015em;margin-top:12px;line-height:1.15;overflow-wrap:anywhere}
.head p{color:var(--ink-3);font-size:13px;font-weight:500;margin-top:3px}

.tree{margin-left:24px}
.tree .tree{margin-left:24px}
.item{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:12px;
  padding:9px 8px 9px 22px;min-height:56px;margin-right:-8px;width:calc(100% + 8px);text-align:left}
.item>.lamp{position:absolute;left:0;top:50%;margin-top:-5.5px}
.item .tx{min-width:0;display:block}
.item .l1{display:flex;align-items:baseline;gap:9px;min-width:0}
.item .nm{font-weight:650;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .id{color:var(--ink-3);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .l2{display:flex;gap:12px;font-size:13px;color:var(--ink-3);font-weight:500;margin-top:2px;flex-wrap:wrap}
.item.dead{color:var(--ink-3)}
.item.dead .nm{color:var(--ink-2)}
.item.seat{cursor:pointer}
.item.seat:hover,.item.seat.hov{background:var(--paper-2)}
.item.team{min-height:40px;padding-top:12px;padding-bottom:4px}
.item.team .nm{font-size:14px;font-weight:700}
.item.team>.lamp{background:transparent;border:1.5px solid var(--ink);transform:rotate(45deg) scale(.82)}
.outside{margin-top:48px;padding-top:14px;border-top:1px solid var(--rule);color:var(--ink-3);font-size:13px;font-weight:500}
.outside .row{display:flex;flex-wrap:wrap;gap:4px 28px;margin-top:6px}
.outside .item{width:auto;min-width:220px;margin-right:0}

.env{position:absolute;left:0;top:0;width:15px;height:11px;margin:-5.5px 0 0 -7.5px;pointer-events:none;opacity:0;z-index:3}
.env svg{display:block}
.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.28)}}

/* ---------- harness ---------- */
.har{padding:40px 32px 72px;padding-left:max(32px,env(safe-area-inset-left));padding-right:max(32px,env(safe-area-inset-right))}
.har-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px 40px;align-items:end;margin-bottom:34px}
.har-top h1{font-weight:700;font-size:68px;line-height:.92;letter-spacing:-.035em}
.har-top p{color:var(--ink-2);max-width:560px;font-weight:500;padding-bottom:6px}
.groups{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:40px;align-items:stretch}
#h-groups{font-weight:600;color:var(--ink-3);font-size:13px;margin:0 0 10px}
.gchip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;align-items:center;padding:8px 8px 8px 14px;border:1px solid var(--ink);
  min-width:260px;max-width:420px}
.gchip .gn{font-weight:700}
.gchip small{font-size:13px;color:var(--ink-3);font-weight:500}
.gchip .gb{grid-column:1/-1;display:flex;gap:6px;margin-top:6px}
.gchip .gm{grid-column:1/-1;font-size:12.5px;color:var(--ink-3);font-weight:500;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.gchip:hover,.gchip.hov{background:var(--paper-2)}
.gbtn{height:44px;padding:0 14px;border:1px solid var(--ink);font-weight:650;font-size:14px}
.gbtn:hover{background:var(--ink);color:var(--paper)}
.app{margin-top:38px}
.app>header{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 16px;border-top:1px solid var(--ink);padding-top:12px;margin-bottom:16px}
.app h2{font-weight:700;font-size:28px;letter-spacing:-.02em}
.app header p{color:var(--ink-3);font-weight:500;font-size:14px}
.app header .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.app header .acts .hint2{color:var(--ink-3);font-size:13px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:10px}
.tg{width:44px;height:24px;position:relative;border:1.5px solid currentColor;flex:none;display:inline-block}
.tg::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;background:currentColor;transition:transform .16s}
.tg.on::after{transform:translateX(20px)}
.key{position:relative;display:grid;grid-template-rows:auto 1fr auto;text-align:left;height:150px;padding:14px 14px 12px;
  background:var(--key-on);color:var(--on-key);transition:transform .12s;min-height:44px}
.key:active{transform:translateY(1px)}
.key .kt{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--on-key-2)}
.key .kt .lamp{background:var(--on-key)}
.key .kt .act-badge,.key .kt .act-badge[data-activity]{color:var(--on-key-2)}
.key[data-st=idle] .kt .lamp{background:var(--on-key-2)}
.key .kn{align-self:end;font-weight:700;font-size:21px;letter-spacing:-.015em;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.key .kl{display:block;font-size:13px;font-weight:500;color:var(--on-key-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.key .kb{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.key .ks{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.key .tg{width:34px;height:20px}
.key .tg::after{width:12px;height:12px}
.key .tg.on::after{transform:translateX(14px)}
.key:hover{outline:3px solid var(--red);outline-offset:-3px}
.key.off{background:transparent;color:var(--ink-3);border:1.5px dashed var(--ink-3);padding:12.5px 12.5px 10.5px}
.key.off .kt,.key.off .kl{color:var(--ink-3)}
.key.off .kt .lamp{background:var(--paper);border:1.5px solid var(--ink-3)}
.key.off .kn{color:var(--ink-2)}
.key.off:hover{border-style:solid;border-color:var(--ink);outline:0}
.keys.dim .key:not(.mem){opacity:.28}
.keys.dim .key.mem{outline:3px solid var(--red);outline-offset:3px}
.note2{margin-top:44px;color:var(--ink-3);font-size:13px;max-width:760px}

/* ---------- dialogs: inbox/workbench, letter, compose, activity ----------
   Every layer is head + scrolling body + foot, so Close and the actions never scroll away. */
.sb{overflow:auto;-webkit-overflow-scrolling:touch}
.inspector{position:fixed;inset:0;z-index:20}
.ins-scrim{position:absolute;inset:0;background:var(--scrim)}
.dlg{position:absolute;inset:0;margin:auto;width:var(--dw);height:var(--dh);background:var(--paper);border:1px solid var(--ink);
  display:grid;grid-template-rows:var(--hh) minmax(0,1fr) auto}
.dh{display:flex;align-items:center;gap:16px;padding:0 16px 0 28px;border-bottom:1px solid var(--ink);min-width:0}
.dh h2{font-weight:700;font-size:30px;letter-spacing:-.025em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seg{display:flex;margin-left:12px;border:1px solid var(--ink);flex:none}
.seg button{height:36px;padding:0 14px;font-weight:600;font-size:14px;min-height:36px;position:relative}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.close-x{margin-left:auto;height:44px;min-width:44px;padding:0 14px;border:1px solid var(--ink);font-weight:650;flex:none}
.close-x:hover{background:var(--ink);color:var(--paper)}
.dbody{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);min-height:0}
.list{border-right:1px solid var(--rule);min-height:0}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:16px 20px 16px 28px;border-bottom:1px solid var(--rule);
  width:100%;position:relative;text-align:left;min-height:44px}
.pl:hover{background:var(--paper-2)}
.pl .who{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .tm{color:var(--ink-3);font-size:13px}
.pl .meta{grid-column:1/-1;min-width:0}
.pl .sj{display:block;color:var(--ink-2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .nd{display:block;margin-top:4px}
.pl[aria-selected=true]{background:var(--paper-2)}
.pl[aria-selected=true]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
.pane{padding:26px 36px 32px;min-height:0}
.pane .k{color:var(--ink-3);font-size:13px;font-weight:600}
.pane h3{font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:4px 0 8px;overflow-wrap:anywhere}
.pane .sec{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--ink);padding-top:8px;margin:26px 0 8px;font-weight:700;font-size:14px}
.pane .kv,.sb .kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 14px;font-size:14px}
.pane .kv .k{padding-top:1px}
.pane .kv .mono{font-size:12.5px;overflow-wrap:anywhere}
.pane .metaline{color:var(--ink-2);font-size:13.5px;margin-top:4px}
.pane .fine{color:var(--ink-3);font-size:13.5px;max-width:52ch;margin-top:12px}
.idbox{display:grid;gap:3px}
.idrow{font-size:14px;overflow-wrap:anywhere}
.idrow.muted{color:var(--ink-2)}
.idrow.warn{color:var(--bad);font-weight:600}
.idrow .mono{font-size:12.5px}
.df{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px 12px 20px;border-top:1px solid var(--ink)}
.df .btn,.df .toggle,.df .clear{padding:0 14px}
.cerr{color:var(--bad);font-weight:600;min-height:0;margin:4px 0;overflow-wrap:anywhere}
.cerr:empty{display:none}

.btn{height:44px;padding:0 18px;border:1px solid var(--ink);font-weight:650;background:transparent}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary,.btn.accent{background:var(--ink);color:var(--paper)}
.btn.primary:hover,.btn.accent:hover{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.ghost{border-color:var(--rule);color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--ink);background:transparent;color:var(--ink)}
/* switch / archive-all must be visible and reachable (≥44px) */
.toggle:not(.key),.clear{border:1px solid var(--ink);color:var(--ink);font-weight:650;min-height:44px;padding:0 16px;cursor:pointer}
.toggle:not(.key):hover,.clear:hover{background:var(--ink);color:var(--paper)}

/* the letter: a centred dialog; when the workbench is open on a wide screen it docks over its reading pane */
.sheet-bg{position:fixed;inset:0;background:var(--scrim);z-index:30;display:none}
.sheet-bg.open{display:block}
.letter{position:fixed;inset:0;margin:auto;width:min(680px,calc(100vw - 48px));height:min(720px,calc(100vh - 80px));z-index:31;
  background:var(--paper);border:1px solid var(--ink);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.letter[hidden]{display:none}
.letter.docked{inset:auto;margin:0;left:calc(50% - var(--dw)/2 + var(--lw) + 1px);top:calc(50% - var(--dh)/2 + var(--hh) + 1px);
  width:calc(var(--dw) - var(--lw) - 2px);height:calc(var(--dh) - var(--hh) - 2px);border:0}
.letter .card{display:contents}
.letter .sh{display:flex;align-items:flex-start;gap:16px;padding:20px 16px 16px 36px;border-bottom:1px solid var(--rule)}
.letter .sh .tool{color:var(--ink-3);font-size:13px;font-weight:600;display:block}
.letter .sh h2{font-weight:700;font-size:24px;line-height:1.15;letter-spacing:-.02em;overflow-wrap:anywhere;margin-top:2px}
.letter .sh>div{min-width:0;flex:1}
.letter .sb{padding:22px 36px 28px}
.letter .kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px 14px;font-size:14px;margin-bottom:18px}
.letter .kv .k{color:var(--ink-3);font-weight:600}
.letter .body{white-space:pre-wrap;max-width:64ch;font-size:16px;line-height:1.65;overflow-wrap:anywhere}
.letter .fine{color:var(--ink-3);font-size:13.5px;margin-top:20px;max-width:52ch}
.letter .sf{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding:12px 16px 12px 28px;border-top:1px solid var(--ink)}
.letter .sf{padding-bottom:max(12px,env(safe-area-inset-bottom))}

/* activity drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:39;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:430px;max-width:92vw;background:var(--paper);border-right:1px solid var(--ink);z-index:40;
  transform:translateX(-103%);visibility:hidden;transition:transform .16s ease,visibility 0s linear .16s;display:grid;grid-template-rows:auto minmax(0,1fr)}
.drawer.open{transform:none;visibility:visible;transition:transform .16s ease}
.drawer .dh{height:var(--hh);padding:0 16px 0 24px}
.drawer .dh h2{font-size:22px;margin:0}
.drawer .sb{padding:6px 24px 40px}
.drawer h3{font-weight:700;font-size:14px;border-top:1px solid var(--ink);padding-top:8px;margin:26px 0 8px}
.drawer .row,.drawer .log div{padding:6px 0;border-bottom:1px solid var(--rule);font-size:13.5px;overflow-wrap:anywhere}
.drawer .log span{color:var(--ink-3);margin-right:8px}
.drawer .box{border-bottom:1px solid var(--rule);padding:10px 0}
.drawer .gname,.drawer .name{font-weight:700}
.drawer .gname small,.drawer .name small{color:var(--ink-3);font-weight:500;margin-left:10px;font-size:13px}
.drawer .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;color:var(--ink-3);font-size:13px}
.drawer .settle{color:var(--ink);font-weight:600;font-size:13px;margin-top:4px}
.drawer .state{color:var(--ink-3);font-size:13px}
.meter{display:inline-block;width:90px;height:6px;border:1px solid var(--ink);vertical-align:middle}
.meter i{display:block;height:100%;background:var(--ink)}

/* compose */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;background:var(--scrim);padding:16px}
.modal[hidden]{display:none}
.modal .card{width:600px;max-width:94vw;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);background:var(--paper);border:1px solid var(--ink);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.modal .card.nudge{animation:nudge .32s}
@keyframes nudge{20%{transform:translateX(-7px)}60%{transform:translateX(6px)}}
.modal .dh h3,.modal .dh h2{font-weight:700;font-size:26px;letter-spacing:-.02em}
.modal .sb{padding:22px 28px 8px}
.frow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px;align-items:center;margin-bottom:12px}
.frow label{color:var(--ink-3);font-weight:600;font-size:13.5px}
.frow .fixed{border:1px solid var(--rule);padding:9px 12px;background:var(--paper-2);display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:650}
.frow .fixed .dim{font-size:12px;font-weight:500}
.frow input,.frow textarea{border:1px solid var(--ink);padding:9px 12px;background:var(--paper-2);color:var(--ink);font:inherit;font-size:16px;width:100%;border-radius:0}
.frow textarea{resize:vertical;min-height:120px}
.modal .df{padding-bottom:max(12px,env(safe-area-inset-bottom));justify-content:flex-end}
/* recipient suggestions: a floating list of local names (from /api/state), not a second source of routing truth.
   Absolutely positioned so it never grows the dialog: a growing dialog moves under the pointer between mousedown
   and mouseup and the outside-click guard would misfire. */
.to-wrap{position:relative}
.sug{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;border:1px solid var(--ink);background:var(--paper);max-height:216px;overflow:auto}
.sug[hidden]{display:none}
.sug button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border-bottom:1px solid var(--rule);padding:9px 12px;min-height:44px;align-items:center}
.sug button:last-child{border-bottom:0}
.sug button:hover{background:var(--paper-2)}
.sug .kind{color:var(--ink-3);font-size:12px}
.to-wrap .seg{margin:0 0 8px}

/* outbox */
#outbox{margin-top:0}
.obrow{border-bottom:1px solid var(--rule);padding:14px 20px 14px 28px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.obrow:hover{background:var(--paper-2)}
.obrow .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.obrow .to{font-weight:700;overflow-wrap:anywhere}
.obrow .ref{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.obrow .age{font-size:13px;color:var(--ink-3);margin-left:auto}
.obrow .sj{font-size:14px;overflow-wrap:anywhere}
.obrow .nd{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.obrow .obacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.obrow button{border:1px solid var(--ink);padding:0 14px;min-height:44px;font-weight:600}
.obrow button:hover{background:var(--ink);color:var(--paper)}
.obnote{color:var(--ink-3);font-size:13px}

/* ---------- tablets and phones ---------- */
@media (max-width:1100px){
  .bar{flex-wrap:wrap;padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:6px}
  .bar .sp{display:none}
  .aux{margin-left:auto}
}
@media (max-width:900px){
  .inspector .dlg{inset:0;margin:0;width:100vw;height:100vh;height:100dvh;border:0}
  .letter,.letter.docked{inset:0;margin:0;left:0;top:0;width:100vw;height:100vh;height:100dvh;border:0}
  .dbody{display:block;overflow:auto}
  .dbody .list{border-right:0;border-bottom:1px solid var(--ink);overflow:visible}
  .pane{padding:22px 20px 28px}
  .inspector .dlg{grid-template-rows:auto minmax(0,1fr) auto}
  .inspector .dh{flex-wrap:wrap;height:auto;min-height:var(--hh);gap:8px 12px;padding:10px 12px 10px 16px}
  .inspector .dh h2{font-size:24px;flex:1 1 0}
  .inspector .dh .close-x{margin-left:0}
  .inspector .seg{order:5;margin:0;width:100%}
  .inspector .seg button{flex:1}
  .df .hintp{display:none}
  .df{padding-left:16px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
  .letter .sh{padding:16px 12px 14px 20px}
  .letter .sb{padding:18px 20px 24px}
  .modal{padding:0;align-items:stretch}
  .modal .card{width:100vw;max-width:100vw;height:100vh;height:100dvh;max-height:none;border:0}
}
@media (max-width:760px){
  .bar{position:static;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));gap:0 12px}
  .brand{order:1;flex:1;min-width:0}.brand span{display:none}
  .op-btn{order:2;margin-left:0}
  .tabs{order:3;width:100%;height:44px}
  .tabs button:first-child{padding-left:0}.tabs button:first-child::after{left:0}
  .aux{order:4;width:100%;margin:0;justify-content:space-between}
  .themes{margin:0}.themes button{width:23px}
  .org,.har{padding:24px 16px 48px}
  .root{grid-template-columns:minmax(0,1fr);gap:18px;margin-bottom:44px}
  .root .who{grid-column:auto}
  .root h1,.har-top h1{font-size:48px}
  .stats{gap:22px}.stat b{font-size:28px}
  .cols{grid-template-columns:minmax(0,1fr);gap:40px}
  .har-top{grid-template-columns:minmax(0,1fr)}
  .keys{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .groups{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
  .gchip{max-width:none;min-width:0}
  .key{height:132px;padding:12px}
  .key .kn{font-size:18px}
  .frow{grid-template-columns:minmax(0,1fr);gap:4px}
  .err:not(:empty){padding:10px 16px}
  .foot{padding-left:16px;padding-right:16px}
  .app header .acts{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){
  .lamp,[data-st=working]>.lamp,[data-st=working] .lamp{animation:none}
  .drawer,.key,body,.wires path.route{transition:none}
  .env{display:none}
  .bump,.modal .card.nudge,.note.fade{animation:none}
}

try {
  var _s = localStorage.getItem("postoffice.theme"), _m = { light: "paper", dark: "night" };
  _s = _m[_s] || _s;
  var _ok = ["paper", "night", "mist", "blueprint", "pine", "ember"];
  document.documentElement.dataset.theme = _ok.indexOf(_s) >= 0 ? _s
    : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "paper");
} catch (e) {}
</script>

<body>

<canvas id="ground" aria-hidden="true"></canvas>

<header class="bar" id="bar">
  <div class="brand"><b id="title">联络总站</b><span id="orglabel"></span></div>
  <nav class="tabs">
    <button type="button" id="tab-org" aria-pressed="true"></button>
    <button type="button" id="tab-hk" aria-pressed="false"></button>
  </nav>
  <span class="sp"></span>
  <div class="aux">
    <button type="button" class="act" id="btn-activity"></button>
    <button type="button" class="compose-btn" id="btn-compose"></button>
    <span class="langs" id="langs" role="group">
      <button type="button" data-lang="zh">中文</button>
      <button type="button" data-lang="en">English</button>
    </span>
    <span class="themes" id="theme" role="group">
      <button type="button" data-theme-choice="system"></button>
      <button type="button" data-theme-choice="paper"></button>
      <button type="button" data-theme-choice="night"></button>
      <button type="button" data-theme-choice="mist"></button>
      <button type="button" data-theme-choice="blueprint"></button>
      <button type="button" data-theme-choice="pine"></button>
      <button type="button" data-theme-choice="ember"></button>
    </span>
  </div>
  <button type="button" class="op-btn" id="op-shortcut"></button>
</header>

<div class="err" id="err" role="alert"></div>

<main id="page">
  <section id="boxes"></section>
  <section id="view-hk" hidden>
    <div class="har">
      <div class="har-top">
        <h1 id="h-harness"></h1>
        <p id="hint"></p>
        <div class="stats" id="hk-stats"></div>
      </div>
      <h2 id="h-groups" class="lab" hidden></h2>
      <section id="groups"></section>
      <div id="racks"></div>
      <p class="note2" id="hk-note"></p>
    </div>
  </section>
</main>

<footer class="foot" id="foot"><span id="home-k"></span> <span id="home"></span></footer>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" aria-label="Activity">
  <header class="dh">
    <h2 id="drawer-title"></h2>
    <button type="button" class="close-x" id="drawer-x"></button>
  </header>
  <div class="sb">
    <h3 id="h-aliases"></h3>
    <section id="aliases"></section>
    <h3 id="h-switches"></h3>
    <div class="log" id="switches"></div>
    <h3 id="h-broadcasts"></h3>
    <section id="broadcasts"></section>
    <h3 id="h-log"></h3>
    <div class="log" id="log"></div>
  </div>
</aside>

<div class="sheet-bg" id="sheet-bg" aria-hidden="true"></div>
<section class="letter" id="letter" hidden role="dialog" aria-modal="true" tabindex="-1"></section>

<div class="modal" id="compose" hidden role="dialog" aria-modal="true" aria-labelledby="compose-title">

    <header class="dh">
      <h2 id="compose-title"></h2>
      <button type="button" class="close-x" id="compose-x"></button>
    </header>
    <div class="sb">
      <div class="frow"><label id="compose-from-l"></label>
        <div class="fixed"><span id="compose-from"></span><span class="dim" id="compose-fromnote"></span></div></div>
      <div class="frow"><label for="compose-to" id="compose-to-label"></label>
        <div class="to-wrap">
          <div class="seg" role="group" id="compose-seg">
            <button type="button" id="seg-mbox" aria-pressed="true"></button>
            <button type="button" id="seg-alias" aria-pressed="false"></button>

      <div class="frow"><label for="compose-need" id="c-nd"></label><input id="compose-need" autocomplete="off"></div>
      <div class="frow" style="align-items:start"><label for="compose-body" id="c-bd" style="padding-top:8px"></label><textarea id="compose-body" rows="5"></textarea></div>
      <div class="cerr" id="compose-err" aria-live="polite"></div>
    </div>
    <footer class="df">
      <button type="button" class="btn ghost" id="compose-cancel"></button>
      <button type="button" class="btn primary" id="compose-send"></button>

</div>

const fmt = (key, vars) => {
  let s = STR[lang][key] ?? key;
  for (const k in vars) s = s.replaceAll("{" + k + "}", vars[k]);
  return s;
};
const t = (key) => STR[lang][key] ?? key;

// zh by browser language, English for anything else; a manual choice wins and survives a reload,
// and an unavailable storage must not break the switch.
let lang = "en";
const store = {
  get() { try { return window.localStorage.getItem("postoffice.lang"); } catch { return null; } },
  set(v) { try { window.localStorage.setItem("postoffice.lang", v); } catch {} },
};
const browserLang = () => {
  try { return String((navigator.languages && navigator.languages[0]) || navigator.language || ""); } catch { return ""; }
};
lang = store.get() || (browserLang().toLowerCase().startsWith("zh") ? "zh" : "en");

// Appearance: like the language it is presentation only — kept in localStorage, never a write request.
// "system" resolves to paper by day and night when the OS is dark; every other choice is a named palette.
// A palette is a block of the same role variables in the stylesheet, so adding one never touches the script.
const THEME_KEY = "postoffice.theme";
const PALETTES = ["paper", "night", "mist", "blueprint", "pine", "ember"];
const LEGACY_THEME = { light: "paper", dark: "night" };   // choices saved by older versions of this page
const themeStore = {
  get() { try { return window.localStorage.getItem(THEME_KEY); } catch { return null; } },
  set(v) { try { window.localStorage.setItem(THEME_KEY, v); } catch {} },
};
const cleanTheme = (c) => { c = LEGACY_THEME[c] || c; return PALETTES.includes(c) ? c : "system"; };
let themeChoice = cleanTheme(themeStore.get());
const prefersDark = () => {
  try { return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); } catch { return false; }
};
const resolveTheme = (c) => (c === "system" ? (prefersDark() ? "night" : "paper") : c);
const themeLabel = (c) => t("theme" + c.charAt(0).toUpperCase() + c.slice(1));
function applyTheme(choice) {
  themeChoice = cleanTheme(choice);
  themeStore.set(themeChoice);
  try { document.documentElement.dataset.theme = resolveTheme(themeChoice); } catch {}
  const g = $("theme");
  if (g && g.children) {
    try { g.setAttribute("aria-label", t("appearance")); } catch {}
    for (const b of g.children) {
      const c = b.dataset && b.dataset.themeChoice;
      if (!c) continue;
      b.textContent = themeLabel(c);
      if (b.setAttribute) { b.setAttribute("aria-pressed", String(c === themeChoice)); b.setAttribute("title", themeLabel(c)); }
    }
  }
  redrawFx();                      // canvas colours and wire geometry follow the palette
}
// "System" follows live OS changes; an explicit palette ignores them (read-only, no write requests)
const syncSystemTheme = () => {
  if (themeChoice !== "system") return;
  try { document.documentElement.dataset.theme = resolveTheme("system"); } catch {}
  redrawFx();
};
try {
  const mq = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)");
  if (mq && mq.addEventListener) mq.addEventListener("change", syncSystemTheme);
  else if (mq && mq.addListener) mq.addListener(syncSystemTheme);
} catch {}

// null-safe listeners: the page also runs under minimal DOM stubs in tests
const setClass = (el, cls, on) => { try { if (!el || !el.classList) return; if (on) el.classList.add(cls); else el.classList.remove(cls); } catch {} };
const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };
const setTxt = (id, s) => { const el = $(id); if (el) el.textContent = s; };
// status toast: set the text and restart the fade (no timers; the CSS animation does the fading)
function say(msg) {
  const el = $("letter-status");
  if (!el) return;
  el.textContent = msg;
  setClass(el, "fade", false);
  if (msg) { try { void el.offsetWidth; } catch {} setClass(el, "fade", true); }
}

let STATE = null;                 // latest /api/state
let view = "org";                 // org | hk
let insBox = null;                // mailbox shown in the workbench dialog
let insOpen = false;              // the workbench is a dialog: closed until someone opens it, on every screen size
let insTab = "inbox";             // dialog tabs: inbox | outbox (not a third page)
let OUTBOX = null;                // latest /api/outbox rows (null = never read)
let composeMode = "new";          // new | reply
let replyOf = null;               // {box,id} when composing a reply
let sending = false;              // compose double-click guard
const replySent = new Set();      // "<box>/<id>" replies already sent this page session

const boxesByName = () => { const m = {}; for (const b of (STATE?.boxes || [])) m[b.name] = b; return m; };
const panelInfo = () => (STATE && STATE.panel) || { ok: false, label: "", operator: "", organization: null, error: "" };
const operatorName = () => { const p = panelInfo(); return p.ok ? p.operator : ""; };
const operatorValid = () => { const op = operatorName(); return !!op && !!(STATE?.boxes || []).some((b) => b.name === op); };
const boxOf = (name) => boxesByName()[name] || null;
const waitingOf = (b) => ((b && b.counts && b.counts.waiting) || 0);

const stHTML = (online) => online
  ? `<span class="st on"><span class="dot on"></span>${esc(t("online"))}</span>`
  : `<span class="st off"><span class="dot"></span>${esc(t("offline"))}</span>`;
const counts = (c) => fmt("counts", { w: c.waiting, r: c.reminded });
const statusChip = (s) => `<span class="chip ${s === "failed" ? "bad" : s === "reminded" ? "mid" : ""}">${
  s === "waiting" ? t("waiting") : s === "reminded" ? t("reminded") : t("failed")}</span>`;
const mailBox = (n) => n > 0 ? `<span class="mail" role="img" aria-label="${esc(fmt("waitingTip", { n }))}" title="${esc(fmt("waitingTip", { n }))}">${n}</span>` : "";
// the backend labels the hand-written channel "手动"; show it in the page language (every other app name is shown as given)
const appName = (b) => (b && (b.app === "手动" || b.app === "Manual" || (!b.app && b.method === "notify")) ? t("appManual") : (b && b.app) || "");
const plural = (n, one, many) => (n === 1 ? t(one) : fmt(many, { n }));

/* ---------- runtime presence (presentation only; never touches routing) ---------- */

const isOperatorBox = (b) => !!b && b.name === operatorName() && operatorValid();
const durText = (since) => {
  if (typeof since !== "number" || !isFinite(since)) return "";
  const secs = Math.max(0, Math.floor(Date.now() / 1000 - since));
  const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
};
// The operator is a person: always HUMAN, never a made-up IDLE. Everyone else shows only what the server reports.
function activityBadge(b, asOperator) {
  if (asOperator) return `<span class="act-badge" data-activity="human">${esc(t("actHuman"))}</span>`;
  const a = (b && b.activity) || {};
  const st = a.state === "working" || a.state === "idle" ? a.state : "unknown";
  const label = st === "working" ? t("actWorking") : st === "idle" ? t("actIdle") : t("actUnknown");
  const d = st === "unknown" ? "" : durText(a.since);
  return `<span class="act-badge" data-activity="${st}">${esc(label)}${d ? ` · ${esc(d)}` : ""}</span>`;
}
// lamp state: offline (hollow) / human (round) / working / idle / online-unknown
const lampSt = (b) => !b.online ? "offline" : isOperatorBox(b) || /^(手动|manual)$/i.test(String(b.app || "")) ? "human"
  : ((b.activity && (b.activity.state === "working" || b.activity.state === "idle")) ? b.activity.state : "unknown");
const lampHuman = (b) => isOperatorBox(b) || /^(手动|manual)$/i.test(String(b.app || ""));

/* ---------- ORGANIZATION view ----------
   Nothing about the company is written into this page. The tree comes from panel.organization in /api/state
   (config.json "panel" section); without it the mailboxes are grouped by the app they run in. Wires are
   measured from the laid-out page, so any depth and any number of seats work. */

let orgLabels = {};
const orgLabel = (name) => orgLabels[name] || (boxOf(name)?.identity?.profile?.display_name) || "";
let NODES = {};                   // wire graph: id -> {parent, kind, box}
let teamN = 0;
let ROOT_MAILBOX = "";
const sid = (name) => "s:" + name;
const kidsOf = (n) => [...(n.members || []).map((m) => ({ mailbox: m, _member: 1 })), ...(n.children || [])];
function seatsUnder(n) {
  let a = n.mailbox ? [n.mailbox] : [];
  (n.members || []).forEach((m) => a.push(m));
  (n.children || []).forEach((c) => { a = a.concat(seatsUnder(c)); });
  return a;
}

function seatHTML(id, name, label) {
  const b = boxOf(name);
  if (!b) {
    return `<button type="button" class="item seat dead" data-id="${esc(id)}" data-st="offline" disabled>
      <i class="lamp"></i><span class="tx"><span class="l1"><span class="nm">${esc(label || name)}</span></span>
      <span class="l2"><span>${esc(name)} ${esc(t("notMailbox"))}</span></span></span><span></span></button>`;
  }
  const human = lampHuman(b);
  const own = label || orgLabel(name);
  const tip = own && own !== name ? `${own} (${name})` : name;
  return `<button type="button" class="item seat ${b.online ? "" : "dead"}" data-box="${esc(name)}" data-id="${esc(id)}"
    data-st="${lampSt(b)}" title="${esc(tip)}" ${insBox === name && insOpen ? 'aria-current="true"' : ""}>
    <i class="lamp${human ? " human" : ""}"></i>
    <span class="tx"><span class="l1"><span class="nm">${esc(own || name)}</span>${own && own !== name ? `<span class="id">${esc(name)}</span>` : ""}</span>
    <span class="l2"><span>${esc(appName(b))}</span>${b.online ? activityBadge(b, isOperatorBox(b)) : `<span class="act-badge">${esc(t("offline"))}</span>`}</span></span>
    ${mailBox(waitingOf(b)) || "<span></span>"}</button>`;
}
function treeHTML(node, parent) {
  const id = node.mailbox ? sid(node.mailbox) : "t" + (teamN++);
  NODES[id] = { parent, kind: "item", box: node.mailbox };
  const kids = kidsOf(node);
  let out = "<li>";
  if (node.mailbox) out += seatHTML(id, node.mailbox, node._member ? "" : node.label);
  else out += `<div class="item team" data-id="${esc(id)}"><i class="lamp"></i><span class="tx"><span class="l1"><span class="nm">${esc(node.label || "")}</span>
    <span class="id">${esc(plural((node.members || []).length, "seats1", "teamSeats"))}</span></span></span><span></span></div>`;
  if (kids.length) out += `<ul class="tree">${kids.map((k) => treeHTML(k, id)).join("")}</ul>`;
  return out + "</li>";
}

// the tree to draw: the configured organization, or (no organization / a broken one) one branch per app
function orgModel() {
  const p = panelInfo();
  const boxes = STATE?.boxes || [];
  const op = operatorName();
  const opBox = op && boxOf(op) ? op : "";
  if (p.ok && p.organization) return { configured: true, root: p.organization, label: p.organization.label || p.organization.mailbox || p.label || t("title") };
  const apps = [...new Set(boxes.filter((b) => b.name !== opBox).map((b) => b.app))];
  return { configured: false, label: p.label || t("title"),
    root: { mailbox: opBox || undefined, label: p.label || t("title"),
      children: apps.map((a) => ({ label: a, members: boxes.filter((b) => b.app === a && b.name !== opBox).map((b) => b.name) })) } };
}

function orgHTML() {
  const p = panelInfo();
  const M = orgModel();
  const root = M.root;
  orgLabels = {};
  const collect = (n) => {
    if (!n || typeof n !== "object") return;
    if (n.label && n.mailbox && !orgLabels[n.mailbox]) orgLabels[n.mailbox] = n.label;
    (n.children || []).forEach(collect);
  };
  if (M.configured) collect(root);

  NODES = { root: { kind: "root", box: root.mailbox } }; teamN = 0; ROOT_MAILBOX = root.mailbox || "";
  const boxes = STATE?.boxes || [];
  const op = operatorName(), opOK = operatorValid();
  const onlineN = boxes.filter((b) => b.online).length;
  const workingN = boxes.filter((b) => b.online && !isOperatorBox(b) && b.activity && b.activity.state === "working").length;
  const transitN = boxes.reduce((s, b) => s + waitingOf(b), 0);
  const mine = opOK ? waitingOf(boxOf(op)) : 0;
  const rootBox = root.mailbox ? boxOf(root.mailbox) : null;

  const cols = (root.children || []).map((c, i) => {
    const hid = "h" + i;
    NODES[hid] = { parent: "root", kind: "head" };
    const seats = seatsUnder(c).filter((s) => boxOf(s));
    const on = seats.filter((s) => boxOf(s).online).length;
    const mail = seats.reduce((s, x) => s + waitingOf(boxOf(x)), 0);
    let body;
    if (c.mailbox) {
      NODES[sid(c.mailbox)] = { parent: hid, kind: "item", box: c.mailbox };
      const k = kidsOf(c);
      body = `<ul class="tree"><li>${seatHTML(sid(c.mailbox), c.mailbox, "")}${k.length ? `<ul class="tree">${k.map((x) => treeHTML(x, sid(c.mailbox))).join("")}</ul>` : ""}</li></ul>`;
    } else {
      body = `<ul class="tree">${kidsOf(c).map((k) => treeHTML(k, hid)).join("")}</ul>`;
    }
    const line = [plural(seats.length, "seats1", "seatsN"), fmt("onlineN", { n: on }), mail ? plural(mail, "letters1", "lettersN") : ""]
      .filter(Boolean).join(t("sep"));
    return `<div class="col"><div class="head" data-id="${hid}"><i class="mk"></i><span class="num">${String(i + 1).padStart(2, "0")}</span>
      <h2>${esc(c.label || c.mailbox || "")}</h2><p>${esc(line)}</p></div>${body}</div>`;
  }).join("");

  const inTree = new Set(seatsUnder(root));
  const outside = boxes.filter((b) => !inTree.has(b.name));
  const outsideHTML = outside.length ? `<div class="outside"><span>${esc(t("unassigned"))}</span>
    <div class="row">${outside.map((b) => seatHTML("x:" + b.name, b.name, "")).join("")}</div></div>` : "";

  const note = !M.configured
    ? `<div class="orgnote">${p.error && !p.ok ? `${esc(t("panelBad"))} ${esc(p.error)}` : esc(t("noOrg"))}</div>` : "";
  const rootIsOp = !!root.mailbox && root.mailbox === op && opOK;
  const whoLine = root.mailbox
    ? (rootIsOp ? `<b>${esc(root.mailbox)}</b>&ensp;${esc(t("humanOperator"))}`
      : (rootBox ? `<button type="button" class="lk" data-box="${esc(root.mailbox)}"><b>${esc(root.mailbox)}</b></button>` : `<b>${esc(root.mailbox)}</b>`))

let currentLetter = null;           // {box, id} of the letter in the detail layer (buttons carry no business data; this is the truth)

async function openLetter(box, id) {
  const seq = ++letterSeq;
  editingOutbox = null;              // back to reading: the edit layer is void
  openOutboxRef = null;              // reading voids the outbox detail layer
  say("");
  try {
    const r = await fetch(`/api/letter?box=${encodeURIComponent(box)}&id=${encodeURIComponent(id)}`);
    if (seq !== letterSeq) return;          // a newer open/close happened: drop this result
    if (!r.ok) {
      closeLetter();
      say(r.status === 404 ? t("notFound") : t("errRead"));
      return;
    }
    const d = await r.json();
    if (seq !== letterSeq) return;
    currentLetter = { box, id, sender: d.sender || "" };   // canonical sender: a reply must never be prefilled from the ≤30-char display string
    const el = $("letter");
    if (!el) return;
    el.innerHTML = `<div class="card">${letterHTML(d)}</div>`;
    showLetterLayer();
    markSelected();

    if (seq !== letterSeq) return;
    closeLetter();

function closeLetter() {
  letterSeq++;                      // void every in-flight read so none of them reopens the layer
  currentLetter = null;
  editingOutbox = null;
  openOutboxRef = null;
  const el = $("letter");
  const was = letterOpen();
  if (el) { el.hidden = true; el.innerHTML = ""; setClass(el, "open", false); setClass(el, "docked", false); }
  setClass($("sheet-bg"), "open", false);
  markSelected();
  if (was) layersChanged(false, "letter"); else syncLayerState();
  // the hash is not cleared here: applyLang also runs closeLetter at init and would erase a deep link that is still waiting.
  // A deep link is consumed once by handleDeepLink (cleared when it opens or errors), so polling never replays it.
}

function clearHash() {
  try {

    if (typeof history !== "undefined" && history.replaceState) {
      history.replaceState(null, "", location.pathname + location.search);
    } else if (window.location) window.location.hash = "";

/* ---------- recipient suggestions: dropdown + prefix fuzzy match ---------- */
// The list comes from /api/state (physical mailboxes + logical addresses): a display suggestion, not a second
// source of routing truth. Picking one only fills the input; sending still goes through /api/send, the same core.
function recipientList() {
  const out = [];
  for (const b of (STATE?.boxes || [])) out.push({ v: b.name, kind: t("segMailbox") });
  for (const a of (STATE?.aliases || [])) if (!a.error) out.push({ v: "@" + a.name, kind: t("segAlias") });

  for (const seg of n.split(/[_\.\-]+/)) if (seg.startsWith(q)) return true;
  return false;
}

  box.innerHTML = hits.map((r) => `<button type="button" data-v="${esc(r.v)}" role="option">` +

async function sendCompose() {
  if (sending) return;                       // a double click sends once
  setTxt("compose-err", "");
  if (!operatorValid()) { setTxt("compose-err", t("operatorBad")); return; }
  const to = ($("compose-to").value || "").trim();
  const subject = $("compose-subject").value;
  const need = $("compose-need").value;
  const body = $("compose-body").value;
  if (!to.startsWith("@") && (STATE?.groups || []).some((g) => g.name === to)) {
    setTxt("compose-err", t("groupReject"));
    return;
  }
  sending = true;
  $("compose-send").disabled = true;
  try {
    const r = await fetch("/api/send", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ from: operatorName(), to, subject, need, body }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { setTxt("compose-err", j.message || t("errStatus")); return; }
    if (composeMode === "reply" && replyOf && currentLetter
        && currentLetter.box === replyOf.box && currentLetter.id === replyOf.id) {
      // etiquette: for a letter that needs a reply, the reply IS the answer — file the original, never ack
      const { box, id } = replyOf;
      replySent.add(`${box}/${id}`);
      const a = await fetch("/api/archive-one", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ box, id }) });
      closeCompose();
      if (a.ok) {
        closeLetter();
        say(t("doneOk"));
      } else {
        // the reply is already out: only retrying the filing is allowed, never another reply
        await renderReplyArchiveFail(box, id);
        say(t("replySentArchiveFail"));
      }
      return load();
    }
    closeCompose();
    say(`${t("sentOk")} · ${t("idLabel")} ${j.id || "—"} · ${t("refLabel")} ${j.ref || "—"}`);
    return load();
  } catch (e) {
    if (composeMode === "reply" && replyOf && replySent.has(`${replyOf.box}/${replyOf.id}`)) {
      // the archive request threw at the network layer: the reply is out all the same, fall back to "file only"
      const { box, id } = replyOf;      // closeCompose clears replyOf, take the reference first
      closeCompose();
      await renderReplyArchiveFail(box, id);
      say(t("replySentArchiveFail"));
      return load();
    }
    setTxt("compose-err", t("errOffline"));
  } finally {
    sending = false;
    const btn = $("compose-send"); if (btn) btn.disabled = !operatorValid();
  }
}

// reply sent, filing failed: draw the letter again; letterHTML sees replySent and offers "Retry filing" only, never a second reply
async function renderReplyArchiveFail(box, id) {
  const seq = ++letterSeq;
  try {
    const lr = await fetch(`/api/letter?box=${encodeURIComponent(box)}&id=${encodeURIComponent(id)}`);
    if (seq === letterSeq && lr.ok) {
      const d = await lr.json();
      currentLetter = { box, id, sender: d.sender || "" };
      const el = $("letter");
      if (!el) return;
      el.innerHTML = `<div class="card">${letterHTML(d)}</div>`;
      try { el.setAttribute("aria-label", t("letterDetail")); } catch {}
      showLetterLayer();
    }
  } catch {}
}

  setTxt("compose-send", t("send"));
  setTxt("compose-cancel", t("cancel"));
  setTxt("seg-mbox", t("segMailbox"));
  setTxt("seg-alias", t("segAlias"));
  const langs = $("langs");
  if (langs) {
    langs.setAttribute("aria-label", t("langLabel"));
    for (const b of langs.children) b.setAttribute("aria-pressed", String(b.dataset.lang === lang));
  }
  closeLetter();                    // the detail is a temporary view: switching language leaves no stale-language remnants
  say("");
  applyTheme(themeChoice);          // appearance labels follow the language (still read-only, no write requests)
  return load();
}

/* ---------- data render ---------- */

// The poll redraws every 5 s. Unchanged HTML is never touched; changed HTML keeps the dialog's scroll position
// and the focused control, otherwise reading a long list would be thrown back to the top mid-sentence.
const painted = {};
function paintInto(id, html, keepScroll) {
  const el = $(id);
  if (!el) return false;
  if (painted[id] === html && el.innerHTML) return false;
  const scroll = {};
  let again = "";
  try {
    if (keepScroll && el.querySelector) for (const s of keepScroll) { const n = el.querySelector("#" + s); if (n) scroll[s] = n.scrollTop; }
    const a = document.activeElement;
    if (a && a.getAttribute && el.contains && el.contains(a)) again = focusSel(a);
  } catch {}
  el.innerHTML = html; painted[id] = html;
  try {
    for (const s in scroll) { const n = el.querySelector("#" + s); if (n && scroll[s]) n.scrollTop = scroll[s]; }
    if (again) { const n = el.querySelector(again); if (n && n.focus) n.focus({ preventScroll: true }); }
  } catch {}
  return true;
}
function renderBoxes() {
  let ins = insOpen ? inspectorHTML() : "";
  if (insOpen && !ins) insOpen = false;          // nothing to show (no mailbox left): never leave the page locked behind an empty window
  const html = (view === "org" ? orgHTML() : "") + ins;
  if (paintInto("boxes", html, ["ins-list", "ins-pane"])) { redrawFx(); }
  syncLayerState();      // the org wrapper is a new node after a repaint: re-apply inert
}

async function load() {
  try {
    const st = await (await fetch("/api/state")).json();
    STATE = st;
    setTxt("err", "");
    setTxt("home", st.home);
    const P = panelInfo();
    setTxt("orglabel", P.ok && P.label && P.label !== STR.zh.title && P.label !== STR.en.title ? P.label : "");
    if (insOpen && insTab === "outbox") await refreshOutbox();   // the Outbox tab refreshes with the poll (read-only), not frozen at the moment it was opened
    renderBoxes();
    const hkEl = $("view-hk");
    if (hkEl) {
      hkEl.hidden = view !== "hk";
      const hg = $("h-groups"); if (hg) hg.hidden = !(st.groups || []).length;
    }
    paintInto("hk-stats", hkStatsHTML());
    paintInto("groups", groupsHTML());
    if (view === "hk") paintInto("racks", harnessHTML());
    else if (painted["racks"]) { painted["racks"] = ""; const r = $("racks"); if (r) r.innerHTML = ""; }
    const opEl = $("op-shortcut");
    if (opEl) {
      const o = opBadgeHTML();
      if (painted["op"] !== o) { opEl.innerHTML = o; painted["op"] = o; }
      try { opEl.setAttribute("aria-label", operatorName() ? `${operatorName()} · ${t("humanOperator")} · ${t("inbox")} ${waitingOf(boxOf(operatorName()))}` : ""); } catch {}
    }
    // ACTIVITY drawer
    const al = st.aliases || [];
    const aliasesEl = $("aliases");
    if (aliasesEl) aliasesEl.innerHTML = al.length ? al.map((a) => {
      if (a.error) {
        return `<div class="box"><div class="gname">@${esc(a.name)}<small>${esc(t("aliasBad"))}</small></div>
          <div class="meta">${esc(a.error)}</div></div>`;
      }
      return `
      <div class="box">
        <div class="gname">@${esc(a.name)}<small>${esc(a.target || t("aliasNone"))}</small></div>
        <div class="meta">${a.candidates.map((c) =>
          `<span class="chip">${esc(c.name)}${c.known ? "" : `（${esc(t("notRegistered"))}）`}${c.known ? (c.online ? ` ${esc(t("online"))}` : ` ${esc(t("offline"))}`) : ""}</span>`).join("")}
          ${a.notify && a.notify.length ? `<span class="chip">${esc(fmt("aliasNotify", { n: a.notify.map(esc).join("、") }))}</span>` : ""}</div>
        ${a.pending ? `<div class="settle">${esc(fmt("aliasPending", { a: a.confirmed || t("aliasNone"), b: a.pending || t("aliasNone"), s: a.pending_in }))}</div>` : ""}
      </div>`; }).join("") : `<p class="hintp">${esc(t("noAliases"))}</p>`;
    const sw = st.switches || [];
    const switchesEl = $("switches");
    if (switchesEl) switchesEl.innerHTML = sw.length ? sw.map((s) => `<div>${esc(s.text)}</div>`).join("")
      : `<span>${esc(t("emptySwitches"))}</span>`;   // raw log lines stay in the original wording
    const bcs = st.broadcasts || [];
    const bcsEl = $("broadcasts");
    if (bcsEl) bcsEl.innerHTML = bcs.length ? bcs.map((b) => `
      <div class="box">
        <div class="name">${esc(b.subject)}<small>${esc(t("from"))} ${esc(b.from)}</small></div>
        <div class="state">${b.acked}/${b.total}</div>
        <div class="meta"><span class="chip">${esc(b.error ? t("bErr") : b.summarized ? t("bDone") : t("bOpen"))}</span>${esc(b.id)} · ${esc(t("bDeadline"))} ${esc(b.deadline)}
          <span class="meter"><i style="width:${b.total ? Math.round(b.acked * 100 / b.total) : 0}%"></i></span></div>
      </div>`).join("") : `<p class="hintp">${esc(t("emptyBroadcasts"))}</p>`;
    const logEl = $("log");
    if (logEl) logEl.innerHTML = (st.log || []).map((l) => `<div><span>${esc(l.t.slice(5))} ${esc(l.src)}</span> ${esc(l.msg)}</div>`).join("")
      || `<span>${esc(t("emptyLog"))}</span>`;       // raw log lines stay in the original wording
    syncLayerState();
    handleDeepLink();
  } catch (e) {
    setTxt("err", t("errOffline"));
  }
}

/* ---------- dialog tabs / outbox mutations (share the server's edit/retract core) ---------- */

async function refreshOutbox() {
  try {
    const j = await (await fetch("/api/outbox")).json();
    OUTBOX = (j && j.outbox) || [];
  } catch { OUTBOX = OUTBOX || []; }
}

async function switchInsTab(tab) {
  insTab = tab === "outbox" ? "outbox" : "inbox";
  if (insTab === "outbox") await refreshOutbox();   // reading /api/outbox happens only when the tab is shown (read-only)
  renderBoxes();
}

function openEdit(to, id) {
  const r = (OUTBOX || []).find((x) => x.to === to && x.id === id);
  if (!r) return;
  letterSeq++;                       // void any in-flight openLetter: a late read must not overwrite the edit layer or change its target
  currentLetter = null;
  editingOutbox = { to, id };
  openOutboxRef = null;
  const el = $("letter");
  if (!el) return;
  el.innerHTML = `<div class="card">
    <header class="sh"><div><span class="tool">${esc(t("tabOutbox"))} · ${esc(to)}/${esc(id)}</span><h2>${esc(t("editOpen"))}</h2></div>
      <button type="button" class="close-x" data-edit-close="1">${esc(t("closeLetter"))}</button></header>
    <div class="sb">
      <div class="frow"><label for="edit-subject">${esc(t("subject"))}</label><input id="edit-subject"></div>
      <div class="frow"><label for="edit-need">${esc(t("need"))}</label><input id="edit-need"></div>
      <div class="frow" style="align-items:start"><label for="edit-body" style="padding-top:8px">${esc(t("body"))}</label><textarea id="edit-body" rows="8"></textarea></div>
    </div>
    <footer class="sf"><button type="button" class="btn primary" data-edit-save="1">${esc(t("editSave"))}</button></footer></div>`;
  showLetterLayer();
  const sj = $("edit-subject"), nd = $("edit-need"), bd = $("edit-body");
  if (sj) sj.value = r.subject || "";
  if (nd) nd.value = r.need || "";
  if (bd) bd.value = r.body || "";
}

async function saveEdit() {
  if (!editingOutbox) return;
  const { to, id } = editingOutbox;
  const payload = { to, id,
    subject: ($("edit-subject") || {}).value || "",
    need: ($("edit-need") || {}).value || "",
    body: ($("edit-body") || {}).value || "" };
  try {
    const r = await fetch("/api/edit-one", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { say(j.message || t("errStatus")); return; }   // failure: keep the edit layer
    editingOutbox = null;
    closeLetter();
    await refreshOutbox();
    renderBoxes();
  } catch { say(t("errOffline")); }
}

async function doRetract(to, id) {
  if (!confirm(fmt("retractConfirm", { to, id }))) return;
  try {
    const r = await fetch("/api/retract-one", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ to, id }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { say(j.message || t("errStatus")); return; }   // failure: keep the row
    await refreshOutbox();
    renderBoxes();
    // retracted: a detail layer showing this letter must agree with the list — close it and say so
    if (openOutboxRef && openOutboxRef.to === to && openOutboxRef.id === id) {
      closeLetter();
      say(t("retractDone"));
    }
  } catch { say(t("errOffline")); }
}

/* ---------- delegated actions ---------- */

// shared by the org view (#boxes) and the harness keys (#racks)
async function mainClick(ev) {
  const t0 = ev.target;
  const c = t0.closest(".clear");
  if (c) {
    const msg = fmt("clearConfirm", { box: c.dataset.clear, w: c.dataset.w, r: c.dataset.r,
                                      f: c.dataset.f || "0", n: c.dataset.n || "0" });
    if (!confirm(msg)) return;
    const r = await fetch("/api/clear", { method: "POST", headers: { "Content-Type": "application/json" },
                                          body: JSON.stringify({ name: c.dataset.clear }) });
    if (!r.ok) setTxt("err", t("errClear"));
    return load();
  }
  const tg = t0.closest(".toggle");
  if (tg) {
    const status = tg.dataset.online === "true" ? "offline" : "online";
    const r = await fetch("/api/status", { method: "POST", headers: { "Content-Type": "application/json" },
                                           body: JSON.stringify({ name: tg.dataset.name, status }) });
    if (!r.ok) setTxt("err", t("errStatus"));
    return load();
  }
  const row = t0.closest("[data-letter]");
  if (row) return openLetter(row.dataset.box, row.dataset.id);
  const cm = t0.closest("[data-compose]");
  if (cm) return openCompose("new", insBox || "");
  const gb = t0.closest("button[data-group]");
  if (gb) {
    const r = await fetch("/api/status", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ group: gb.dataset.group, status: gb.dataset.status }) });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      setTxt("err", j.error || t("errGroup"));
    }
    return load();
  }
  const ic = t0.closest("[data-ins-close]"); // close the dialog; stay on the current page
  if (ic) return closeInspector();
  const it = t0.closest("[data-ins-tab]");   // dialog tabs: Inbox | Outbox (no write requests)
  if (it) return switchInsTab(it.dataset.insTab);
  const oa = t0.closest("[data-outbox-action]");   // outgoing ordinary letters: edit / retract (the same core as the CLI)
  if (oa) return oa.dataset.outboxAction === "retract"
    ? doRetract(oa.dataset.to, oa.dataset.id) : openEdit(oa.dataset.to, oa.dataset.id);
  const orow = t0.closest("[data-outbox]");        // an outbox row itself: open the read-only detail (its buttons were caught above)
  if (orow) return openOutboxDetail(orow.dataset.to, orow.dataset.id);
  const nd = t0.closest("[data-box]");       // open that mailbox's workbench (seats, the operator button, the root)
  if (nd) return openInspector(nd.dataset.box);
}
on("boxes", "click", mainClick);
on("racks", "click", mainClick);

async function handleLetterAction(action) {
  if (action === "close") return closeLetter();
  if (!currentLetter) return;
  const { box, id } = currentLetter;
  if (action === "reply") return openCompose("reply");
  if (action === "retry") return retryArchiveOnly(box, id);
  if (action === "ack") {
    try {
      const r = await fetch("/api/ack-one", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ box, id }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok) {
        closeLetter();
        say(j.state === "already" ? t("alreadyAck") : j.state === "receipt_notice" ? t("receiptNotice") : t("ackedOk"));
        return load();
      }
      say(j.message || (r.status === 404 ? t("notFound") : t("errArchive")));
    } catch (e) { say(t("errArchive")); }
    return;
  }
  if (action !== "done") return;
  try {
    const r = await fetch("/api/archive-one", { method: "POST", headers: { "Content-Type": "application/json" },
                                                body: JSON.stringify({ box, id }) });
    if (r.ok) {
      closeLetter();
      say(t("doneOk"));
      return load();
    }
    say(r.status === 409 ? t("conflict") : r.status === 404 ? t("notFound") : t("errArchive"));
  } catch (e) {
    say(t("errArchive"));
  }
}
on("letter", "click", async (ev) => {
  const la = ev.target.closest("[data-letter-action]");
  if (la && la.dataset && la.dataset.letterAction) {
    if (la.disabled) return;
    return handleLetterAction(la.dataset.letterAction);
  }
  const oa = ev.target.closest("[data-outbox-action]");   // edit / retract inside the outbox detail layer
  if (oa && oa.dataset && oa.dataset.outboxAction) {
    if (oa.disabled) return;
    return oa.dataset.outboxAction === "retract"
      ? doRetract(oa.dataset.to, oa.dataset.id) : openEdit(oa.dataset.to, oa.dataset.id);
  }
  if (ev.target.closest("[data-edit-save]")) return saveEdit();
  if (ev.target.closest("[data-edit-close]")) return closeLetter();
});

// partial failure: the reply is already out — retry filing ONLY, never send again
async function retryArchiveOnly(box, id) {
  try {
    const r = await fetch("/api/archive-one", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ box, id }) });
    if (r.ok) {
      closeLetter();
      say(t("doneOk"));
      return load();
    }
    say(r.status === 409 ? t("conflict") : r.status === 404 ? t("notFound") : t("errArchive"));
  } catch (e) { say(t("errArchive")); }
}

on("groups", "click", async (ev) => {
  const b = ev.target.closest("button[data-group]");
  if (!b) return;
  const r = await fetch("/api/status", { method: "POST", headers: { "Content-Type": "application/json" },
                                         body: JSON.stringify({ group: b.dataset.group, status: b.dataset.status }) });
  if (!r.ok) {
    const e = await r.json().catch(() => ({}));
    setTxt("err", e.error || t("errGroup"));
  }
  load();
});
// hover or focus on a group lights its members' keys (display only)
{
  const g = $("groups");
  const names = (e) => { const c = e && e.target && e.target.closest && e.target.closest(".gchip"); return c && c.dataset ? c.dataset.members : ""; };
  if (g) {
    g.addEventListener("mouseover", (e) => groupHover(names(e)));
    g.addEventListener("mouseout", () => groupHover(""));
    g.addEventListener("focusin", (e) => groupHover(names(e)));
    g.addEventListener("focusout", () => groupHover(""));
  }
}

on("langs", "click", (ev) => {
  const b = ev.target.closest("button[data-lang]");
  if (b) applyLang(b.dataset.lang);   // display only
});

on("theme", "click", (ev) => {
  const b = ev.target.closest("[data-theme-choice]");
  if (b && b.dataset && b.dataset.themeChoice) applyTheme(b.dataset.themeChoice);   // display only
});

/* ---------- tabs / drawer / compose chrome ---------- */

function setView(v) {
  view = v;
  const o = $("tab-org"), h = $("tab-hk");
  if (o) o.setAttribute("aria-pressed", String(v === "org"));
  if (h) h.setAttribute("aria-pressed", String(v === "hk"));
  return load();
}
on("tab-org", "click", () => setView("org"));
on("tab-hk", "click", () => setView("hk"));
on("btn-activity", "click", openDrawer);
on("drawer-x", "click", closeDrawer);
on("scrim", "click", () => { if (drawerOpen()) closeDrawer(); });
on("btn-compose", "click", () => openCompose("new"));
on("compose-x", "click", () => tryCloseCompose(true));
on("compose-cancel", "click", () => tryCloseCompose(true));
on("compose-send", "click", sendCompose);
// a click on the dimmed area closes compose only if the press also started there (a text selection dragged out of the card must not close it),
// and only when nothing is typed: otherwise the card just shakes (Close, Cancel and Esc discard on purpose)
{
  let downOnBackdrop = false;
  on("compose", "mousedown", (e) => { downOnBackdrop = !!e && e.target === $("compose"); });
  on("compose", "click", (e) => { if (e && e.target === $("compose") && downOnBackdrop) tryCloseCompose(false); downOnBackdrop = false; });
}
on("op-shortcut", "click", () => {
  const op = operatorName();
  if (op && boxOf(op)) openInspector(op);   // opens over the current page (Harness stays Harness)
});
on("seg-mbox", "click", () => setSeg("mailbox"));
on("seg-alias", "click", () => setSeg("alias"));
on("sheet-bg", "click", closeLetter);

/* ---------- deep link #/mail/<box>/<id> ---------- */

function readHash() {
  try { return (window.location && window.location.hash) || ""; } catch { return ""; }
}
function handleDeepLink() {
  const h = readHash();
  if (!h) return;
  clearHash();                      // consumed once: after opening or after an error it is cleared, polling never replays it
  const dec = (s) => { try { return decodeURIComponent(s); } catch { return null; } };  // a bad percent-escape is an invalid link, not a crash
  const two = h.match(/^#\/mail\/([^/]+)\/([^/]+)$/);
  if (two) {
    const box = dec(two[1]), id = dec(two[2]);
    if (box !== null && id !== null && /^[A-Za-z0-9_\-]+$/.test(box) && /^[^.\/][^/]*$/.test(id) && !/\.md$/.test(id)) {
      openLetter(box, id);
      return;
    }
    say(t("deepLinkBad"));
    return;
  }
  const one = h.match(/^#\/mail\/([^/]+)$/);
  if (one) {
    const box = dec(one[1]);
    if (box !== null && /^[A-Za-z0-9_\-]+$/.test(box) && boxOf(box)) {
      openInspector(box);           // one segment: straight to that mailbox's workbench
      return;
    }
  }
  say(t("deepLinkBad"));
}
try { window.addEventListener && window.addEventListener("hashchange", handleDeepLink); } catch {}

// Escape closes the top layer: compose, then the Activity drawer, then the letter, then the workbench
try {
  document.addEventListener("keydown", (e) => {
    if (!e || e.key !== "Escape") return;
    closeTopLayer();
  });
} catch {}

{ const m = $("compose"); if (m) m.hidden = true; }   // compose starts closed (the markup also says so)
applyLang(lang);
setInterval(load, 5000);
setInterval(loop, 5200);
startFx();
